    <style>
      /* Print-specific styles */
      @media print {
        /* Hide everything in the body by default */
        body * {
          visibility: hidden;
        }
        /* Make the printable area and everything inside it visible */
        #printable-area, #printable-area * {
          visibility: visible;
        }
        /* Position the printable area to take up the whole page */
        #printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 0;
          margin: 0;
          -webkit-print-color-adjust: exact;
          color-adjust: exact;
        }
        /* Ensure the QR code image scales nicely on the printed page */
        #qr-code-image {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }
      }
    </style>
